<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СВОЯК — викторина</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06131e;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:
linear-gradient(rgba(41,181,229,.16) 1px,transparent 1px),
linear-gradient(90deg,rgba(41,181,229,.16) 1px,transparent 1px);
background-size:42px 42px;transform:perspective(500px) rotateX(58deg) scale(1.8);transform-origin:50% 100%}
.wrap{position:relative;max-width:1400px;margin:auto;padding:22px}
h1{margin:0 0 14px;text-align:center;letter-spacing:5px;font-size:42px;text-shadow:0 0 18px #20bfff}
.top{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.player{background:linear-gradient(180deg,#102a58,#07162f);border:2px solid #2a8ee8;border-radius:10px;padding:10px 16px;min-width:170px;text-align:center;box-shadow:0 0 15px #0066aa55}
.player input{width:100%;background:transparent;border:0;color:#fff;text-align:center;font-size:18px;font-weight:bold;outline:0}
.score{font-size:30px;font-weight:800;margin-top:3px}
.board{display:grid;gap:4px;grid-template-columns:repeat(5,1fr);background:#0d77ad;padding:4px;border:3px solid #8de8ff;border-radius:8px;box-shadow:0 0 30px #009fe855}
.cat{background:#08134b;min-height:78px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:20px;padding:8px}
.cell{min-height:95px;border:0;background:linear-gradient(145deg,#173ea5,#09246e);color:#fff;font-size:34px;font-weight:900;cursor:pointer;transition:.15s}
.cell:hover{transform:scale(.98);background:#2867dd}
.cell.used{visibility:hidden;cursor:default}
.controls{display:flex;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}
button{border:1px solid #4bcaff;background:#0b2e69;color:#fff;border-radius:8px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#1550a4}
.modal{position:fixed;inset:0;background:#020812dd;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.card{width:min(850px,96vw);background:linear-gradient(145deg,#0a1b45,#071225);border:3px solid #42d8ff;border-radius:18px;padding:28px;box-shadow:0 0 45px #00bfff66;text-align:center}
.card .value{color:#7be8ff;font-size:25px;font-weight:800}
.question{font-size:32px;line-height:1.25;margin:28px 0;min-height:120px;display:flex;align-items:center;justify-content:center}
.answer{display:none;margin:10px auto 22px;background:#10295c;border-radius:10px;padding:15px;font-size:22px}
.answer.show{display:block}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.good{background:#08753d;border-color:#44ef9d}.bad{background:#8b1731;border-color:#ff6684}
.timer{font-size:22px;color:#ffe47a;margin-bottom:8px}
.footer{text-align:center;color:#6da4bd;margin-top:14px;font-size:13px}
@media(max-width:800px){.board{grid-template-columns:repeat(5,minmax(90px,1fr));overflow-x:auto}.wrap{min-width:520px}h1{font-size:28px}.cat{font-size:13px}.cell{font-size:25px;min-height:72px}.question{font-size:23px}.player{min-width:120px}.score{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<h1>С В О Я К</h1>
<div class="top" id="players"></div>
<div class="board" id="board"></div>
<div class="controls">
<button onclick="resetGame()">↻ Новая игра</button>
<button onclick="fullscreen()">⛶ Полный экран</button>
<button onclick="editQuestions()">✎ Изменить вопросы</button>
</div>
<div class="footer">Кликните по номиналу — откроется вопрос. Ведущий управляет результатом.</div>
</div>

<div class="modal" id="modal">
<div class="card">
<div class="value" id="modalValue"></div>
<div class="timer" id="timer"></div>
<div class="question" id="question"></div>
<div class="answer" id="answer"></div>
<div class="actions">
<button onclick="showAnswer()">Показать ответ</button>
<button class="good" onclick="score(true)">✓ Правильно</button>
<button class="bad" onclick="score(false)">✕ Неправильно</button>
<button onclick="closeModal()">Закрыть</button>
</div>
</div>
</div>

<script>
const values=[200,400,600,800,1000];
const defaultCats=["Перелез или нет?","Цитаты женских пабликов","СТС","Двули́чные актёры","Что по русскому задали?"];
let players=[{name:"Игрок 1",score:2200},{name:"Игрок 2",score:3800},{name:"Игрок 3",score:2300}];
let questions=defaultCats.map((cat,ci)=>values.map(v=>({
 q:`Вопрос ${v} категории «${cat}»`,
 a:`Ответ на вопрос ${v}`
})));
let current=null,timerId=null,seconds=30;

function renderPlayers(){
 const el=document.getElementById("players"); el.innerHTML="";
 players.forEach((p,i)=>{
  el.innerHTML+=`<div class="player"><input value="${p.name}" onchange="players[${i}].name=this.value"><div class="score" id="score${i}">${p.score}</div></div>`;
 });
}
function renderBoard(){
 const b=document.getElementById("board"); 
 b.innerHTML="";
 defaultCats.forEach(cat=>{
   b.innerHTML+=`<div class="cat">${cat}</div>`;
 });
 values.forEach((v,vi)=>{
   defaultCats.forEach((cat,ci)=>{
     const key=`${ci}-${vi}`;
     const used=localStorage.getItem("used-"+key)==="1";
     b.innerHTML+=`<button class="cell ${used?'used':''}" ${used?'disabled':''} onclick="openQuestion(${ci},${vi})">${v}</button>`;
   });
 });
}
function openQuestion(ci,vi){
 current={ci,vi,value:values[vi]};
 document.getElementById("modalValue").textContent=defaultCats[ci]+" • "+values[vi];
 document.getElementById("question").textContent=questions[ci][vi].q;
 document.getElementById("answer").textContent=questions[ci][vi].a;
 document.getElementById("answer").classList.remove("show");
 document.getElementById("modal").classList.add("show");
 startTimer();
}
function startTimer(){
 clearInterval(timerId); seconds=30; tick();
 timerId=setInterval(()=>{seconds--;tick();if(seconds<=0)clearInterval(timerId)},1000);
}
function tick(){document.getElementById("timer").textContent="Время: "+seconds+" сек."}
function showAnswer(){document.getElementById("answer").classList.add("show")}
function score(correct){
 if(!current)return;
 let who=prompt("Кому записать "+(correct?"+":"-")+current.value+" очков? Введите 1, 2 или 3.");
 let i=Number(who)-1;
 if(i>=0&&i<players.length){players[i].score += correct?current.value:-current.value;document.getElementById("score"+i).textContent=players[i].score}
 localStorage.setItem("used-"+current.ci+"-"+current.vi,"1");
 closeModal();renderBoard();
}
function closeModal(){clearInterval(timerId);document.getElementById("modal").classList.remove("show");current=null}
function resetGame(){if(confirm("Начать новую игру?")){Object.keys(localStorage).filter(k=>k.startsWith("used-")).forEach(k=>localStorage.removeItem(k));players.forEach(p=>p.score=0);renderPlayers();renderBoard()}}
function fullscreen(){document.documentElement.requestFullscreen?.()}
function editQuestions(){
 const ci=prompt("Номер категории (1–5):"); const vi=prompt("Номинал (200/400/600/800/1000):");
 const c=Number(ci)-1,v=values.indexOf(Number(vi));
 if(c<0||c>4||v<0)return;
 const q=prompt("Текст вопроса:",questions[c][v].q); if(q!==null)questions[c][v].q=q;
 const a=prompt("Ответ:",questions[c][v].a); if(a!==null)questions[c][v].a=a;
}
renderPlayers();renderBoard();
</script>
</body>
</html>
